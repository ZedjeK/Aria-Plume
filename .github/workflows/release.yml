# Aria Plume — publication d'une version.
#
# Déclenchement, au choix :
#   - un tag « v<version> » poussé sur GitHub (ex. v0.30.2) ;
#   - à la main, onglet Actions → Release → « Run workflow », en donnant le tag : la release est
#     construite depuis la branche choisie (main) et le tag est créé par GitHub au moment de publier.
#
# Étapes, par les scripts communs des applis Aria : le tag correspond à la version (tools/version.ps1),
# notes, fiche projet et licences complètes (tools/verifier-release.ps1), tests (tools/tester.ps1), test
# de l'application empaquetée sous Linux, construction (build.ps1 : application Windows et extension),
# puis publication de la release. Notes de version : docs/releases/<tag>.md, obligatoire.

name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag de la version (ex. v0.30.2) : doit correspondre aux versions du code"
                required: true

permissions:
    contents: write

concurrency:
    group: release-${{ github.event.inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    release:
        # Version fixée : ubuntu-latest est passé à Ubuntu 26.04 (octobre 2026), que Playwright 1.56
        # (Chromium des tests du complément Office) ne prend pas encore en charge.
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            TAG: ${{ github.event.inputs.tag || github.ref_name }}
        steps:
            # Sur un tag : le code du tag. À la main : la branche choisie dans « Run workflow ».
            - name: Récupérer le code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Installer Node 22
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: app/package-lock.json

            # version.ps1 refuse aussi une application et une extension qui n'ont pas la même version.
            - name: Vérifier que le tag correspond à la version
              shell: pwsh
              run: |
                  $version = "$(./tools/version.ps1 | Select-Object -Last 1)".Trim()
                  Write-Host "tag : $env:TAG · version : $version"
                  if ("v$version" -ne $env:TAG) { Write-Host "::error::Le tag $env:TAG ne correspond pas à la version $version."; exit 1 }

            - name: Vérifier les notes, la fiche projet et les licences
              shell: pwsh
              run: ./tools/verifier-release.ps1 -Tag $env:TAG

            - name: Installer les dépendances de l'application
              working-directory: app
              run: npm ci

            # Les tests du complément Office ouvrent ses pages dans un vrai Chromium.
            - name: Installer Chromium pour les tests
              working-directory: app
              run: npx playwright install --with-deps chromium

            # Banc du moteur (sans recul toléré), robustesse et tests de l'application.
            - name: Tests (tools/tester.ps1)
              shell: pwsh
              run: ./tools/tester.ps1

            - name: Tester l'application empaquetée (Linux)
              working-directory: app
              run: |
                  command -v xvfb-run > /dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
                  xvfb-run -a npm run test:package

            # Application Windows (zip) et extension (zip, avec LICENSE et LICENCES-TIERS.txt),
            # dans .work/sortie/.
            - name: Construire (build.ps1)
              shell: pwsh
              run: ./build.ps1

            - name: Vérifier les licences dans le zip de l'extension
              run: unzip -l ".work/sortie/Aria-Plume-extension-${TAG#v}.zip" extension/LICENSE extension/LICENCES-TIERS.txt

            - name: Publier la release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="${TAG#v}"
                  files=(
                      ".work/sortie/Aria-Plume-${version}-win-x64.zip"
                      ".work/sortie/Aria-Plume-extension-${version}.zip"
                  )
                  ls -la "${files[@]}"
                  # Les notes existent : verifier-release.ps1 l'a contrôlé.
                  notes=(--notes-file "docs/releases/${TAG}.md")
                  if gh release view "$TAG" > /dev/null 2>&1; then
                      gh release upload "$TAG" "${files[@]}" --clobber
                  else
                      # Sans tag existant (lancement à la main), GitHub le crée sur le commit construit.
                      gh release create "$TAG" --target "$GITHUB_SHA" --title "Aria Plume ${version}" "${notes[@]}" "${files[@]}"
                  fi
