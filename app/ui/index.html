<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
    <title>Aria Plume</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header>
        <img src="logo.svg" alt="" width="40" height="40">
        <div>
            <h1>Aria Plume</h1>
            <p id="status">Démarrage du moteur…</p>
        </div>
    </header>
    <main>
        <p class="note">Squelette de l'application (étape 2.1) : le correcteur complet arrive à l'étape 2.2.</p>
        <textarea id="text" spellcheck="false" placeholder="Écris une phrase pour tester le moteur…">Les enfant sont partit a la plage.</textarea>
        <div class="row">
            <select id="lang"><option value="fr">Français</option><option value="en">Anglais</option></select>
            <button id="check" type="button">Vérifier</button>
        </div>
        <ul id="results"></ul>
    </main>
    <script src="app.js"></script>
</body>
</html>
