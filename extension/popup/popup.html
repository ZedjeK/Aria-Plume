<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Aria Plume</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
    <header>
        <span class="brand"><img src="../icons/icon-48.png" width="24" height="24" alt="">Aria Plume</span>
        <span class="head-right">
            <span class="tag">100 % local</span>
            <button id="detach" class="icon" title="Ouvrir dans une fenêtre séparée" aria-label="Ouvrir dans une fenêtre séparée">⧉</button>
            <button id="maximize" class="icon" title="Agrandir la fenêtre" aria-label="Agrandir la fenêtre" hidden>⤢</button>
        </span>
    </header>

    <div class="settings">
    <label class="switch">
        <span>
            <strong>Correction en direct</strong>
            <small>Souligne les fautes pendant que tu écris</small>
        </span>
        <input type="checkbox" id="live">
    </label>

    <label class="switch" id="site-row">
        <span>
            <strong>Actif sur ce site</strong>
            <small id="site-name">…</small>
        </span>
        <input type="checkbox" id="site">
    </label>

    <label class="switch select-row" id="formal-row">
        <span>
            <strong>Français soigné ici</strong>
            <small id="formal-hint">Réglage général : non</small>
        </span>
        <select id="formal-site" aria-label="Français écrit soigné sur ce site">
            <option value="default">Comme d'habitude</option>
            <option value="formal">Toujours</option>
            <option value="casual">Jamais</option>
        </select>
    </label>
    </div>

    <div class="actions">
        <button id="check" class="primary">Vérifier le champ actif</button>
        <button id="translate-page" class="primary">Traduire la page</button>
    </div>
    <div class="actions">
        <button id="options">Réglages</button>
        <button id="bench">Banc d'essai</button>
    </div>

    <div class="tabs" role="tablist" aria-label="Outils">
        <button role="tab" id="tab-quick" aria-controls="panel-quick" aria-selected="true">Traduction</button>
        <button role="tab" id="tab-conj" aria-controls="panel-conj" aria-selected="false">Conjugaison</button>
        <span id="qt-status" class="qt-status"></span>
    </div>

    <section class="quick" id="panel-quick" role="tabpanel" aria-labelledby="tab-quick">
        <div class="qt-grid">
        <div class="bubble">
            <div class="bubble-head">
                <span class="lang" id="qt-lang-a">FR / EN</span>
                <button class="mini" id="qt-copy-a" title="Copier ce texte">Copier</button>
            </div>
            <textarea id="qt-a" rows="2" spellcheck="false" placeholder="Écris ou colle ton texte ici…"></textarea>
        </div>
        <button class="swap" id="qt-swap" title="Échanger les deux bulles">⇅</button>
        <div class="bubble">
            <div class="bubble-head">
                <span class="lang" id="qt-lang-b">FR / EN</span>
                <button class="mini" id="qt-copy-b" title="Copier ce texte">Copier</button>
            </div>
            <textarea id="qt-b" rows="2" spellcheck="false" placeholder="… ou écris ici : l'autre bulle se traduit."></textarea>
        </div>
        </div>
    </section>

    <section class="conj" id="panel-conj" role="tabpanel" aria-labelledby="tab-conj" hidden>
        <form class="conj-form" id="conj-form">
            <input type="text" id="conj-verb" placeholder="Un verbe : marcher, se lever, ou même « marchait »" autocomplete="off" spellcheck="false" aria-label="Verbe à conjuguer">
            <button type="submit" class="primary">Conjuguer</button>
        </form>
        <div class="conj-options" id="conj-options">
            <label><input type="checkbox" data-option="pronominal"> Pronominal</label>
            <label><input type="checkbox" data-option="negative"> Négation</label>
            <label><input type="checkbox" data-option="interrogative"> Interrogatif</label>
            <label><input type="checkbox" data-option="compound"> Temps composés</label>
            <label><input type="checkbox" data-option="feminine"> Féminin</label>
        </div>
        <div class="conj-info" id="conj-info" aria-live="polite"></div>
        <div class="conj-results" id="conj-results"></div>
    </section>
    <p class="hint">Clic droit sur un mot souligné pour le corriger · Alt+Maj+V : panneau · Alt+Maj+L : traduction</p>
</body>
</html>
