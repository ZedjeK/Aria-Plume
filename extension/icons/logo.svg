<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 176 176" width="512" height="512">
  <!-- Logo d'Aria Plume : le A glitché de la famille Aria, avec l'emblème orange au centre
       (l'œil pour Aria Shield, le pouls pour Aria PC-Tune, ici la plume). -->
  <defs>
    <pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#7DF9FF" opacity="0.07"/>
    </pattern>
    <polygon id="a" points="30,130 70,30 90,30 130,130 110,130 80,54 50,130"/>
    <clipPath id="bl"><rect x="0" y="72" width="80" height="90"/></clipPath>
    <clipPath id="br"><rect x="80" y="72" width="80" height="90"/></clipPath>
    <clipPath id="t"><rect x="0" y="0" width="160" height="72"/></clipPath>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="24,0 136,0 160,24 160,136 136,160 24,160 0,136 0,24" fill="#030812"/>
  <polygon points="24,0 136,0 160,24 160,136 136,160 24,160 0,136 0,24" fill="url(#s)"/>
  <polygon points="26,7 134,7 153,26 153,134 134,153 26,153 7,134 7,26" fill="none" stroke="#4D7CFF" stroke-width="1.8" opacity="0.65" filter="url(#g2)"/>
  <g filter="url(#g)" stroke-linejoin="round" fill="none" stroke-width="5">
    <g clip-path="url(#bl)" stroke="#7DF9FF"><use href="#a"/></g>
    <g clip-path="url(#br)" stroke="#5C8BFF"><use href="#a"/></g>
    <g transform="translate(7,0)"><g clip-path="url(#t)" stroke="#FFFFFF"><use href="#a"/></g></g>
  </g>
  <!-- Plume orange couchée au centre du A, comme l'œil et le pouls de la famille. -->
  <g filter="url(#g)">
    <g transform="rotate(-12 80 104) translate(0 4) scale(1.08) translate(-6 -8)">
      <path d="M54,104 C66,95 90,88 114,90 C108,99 97,108 80,111 C69,113 61,109 54,104 Z" fill="#FF8A1F"/>
      <path d="M46,106 L56,104 L110,91.5" fill="none" stroke="#030812" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
      <path d="M86,92.2 L82,98.6 M98,90.8 L95,96 M78,111.4 L80,106 M92,108.6 L93,103.4" fill="none" stroke="#030812" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <path d="M46,106 L54,103 L56,108 Z" fill="#FF8A1F"/>
    </g>
  </g>
</svg>
