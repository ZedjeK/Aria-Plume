<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
<!-- Logo d'Aria Plume : le A glitché néon de la famille Aria, avec la plume orange.
     À rendre avec un navigateur (Chromium) : tous les convertisseurs ne gèrent pas le filtre de halo. -->
<defs><pattern id="S" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#7DF9FF" opacity="0.07"/></pattern>
<polygon id="A" points="30,130 70,30 90,30 130,130 110,130 80,54 50,130"/>
<clipPath id="BL"><rect x="0" y="72" width="80" height="90"/></clipPath>
<clipPath id="BR"><rect x="80" y="72" width="80" height="90"/></clipPath>
<clipPath id="T"><rect x="0" y="0" width="160" height="72"/></clipPath>
<filter id="G" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<polygon points="24,0 136,0 160,24 160,136 136,160 24,160 0,136 0,24" fill="#030812"/>
<polygon points="24,0 136,0 160,24 160,136 136,160 24,160 0,136 0,24" fill="url(#S)"/><polygon points="26,7 134,7 153,26 153,134 134,153 26,153 7,134 7,26" fill="none" stroke="#4D7CFF" stroke-width="1.8" opacity="0.65"/>
<g filter="url(#G)" stroke-linejoin="round">
<g clip-path="url(#BL)" fill="none" stroke="#7DF9FF" stroke-width="5"><use href="#A"/></g>
<g clip-path="url(#BR)" fill="none" stroke="#5C8BFF" stroke-width="5"><use href="#A"/></g>
<g transform="translate(7,0)"><g clip-path="url(#T)" fill="none" stroke="#FFFFFF" stroke-width="5"><use href="#A"/></g></g>
<g transform="rotate(-12 80 104) translate(0 4) scale(1.08) translate(-6 -8)">
<path d="M54,104 C66,95 90,88 114,90 C108,99 97,108 80,111 C69,113 61,109 54,104 Z" fill="#FF8A1F"/>
<path d="M46,106 L56,104 L110,91.5" fill="none" stroke="#030812" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
<path d="M86,92.2 L82,98.6 M98,90.8 L95,96 M78,111.4 L80,106 M92,108.6 L93,103.4" fill="none" stroke="#030812" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
<path d="M46,106 L54,103 L56,108 Z" fill="#FF8A1F"/>
</g>
</g></svg>
